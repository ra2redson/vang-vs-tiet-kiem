name: Update DOJI gold price

on:
  workflow_dispatch:
  schedule:
    # Vietnam is UTC+7. Try several times between 09:05 and 09:50 Vietnam time.
    - cron: "5 2 * * *"    # 09:05 Vietnam
    - cron: "20 2 * * *"   # 09:20 Vietnam
    - cron: "35 2 * * *"   # 09:35 Vietnam
    - cron: "50 2 * * *"   # 09:50 Vietnam

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch DOJI price
        run: python scripts/fetch_doji_price.py

      - name: Commit price snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doji-price.json
          if git diff --cached --quiet; then
            echo "No price file changes."
          else
            git commit -m "Update DOJI gold price snapshot"
            git push
          fi
